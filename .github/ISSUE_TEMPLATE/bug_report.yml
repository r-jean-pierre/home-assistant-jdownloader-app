name: Bug report
description: Report a problem with the JDownloader 2 Home Assistant App
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, follow [SECURITY.md](https://github.com/r-jean-pierre/home-assistant-jdownloader-app/blob/main/SECURITY.md).

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: JDownloader 2 App version
      placeholder: "0.1.7"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Device architecture
      options:
        - amd64
        - aarch64
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Download storage
      options:
        - Local storage
        - SMB/CIFS
        - NFS
        - Other or unknown

  - type: textarea
    id: problem
    attributes:
      label: Problem and steps to reproduce
      description: Explain what happened, how to reproduce it, and what you expected.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant App or Supervisor logs
      description: Remove passwords, MyJDownloader credentials, tokens and personal information.
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and checked the App documentation.
          required: true
        - label: I removed secrets and personal information from this report.
          required: true